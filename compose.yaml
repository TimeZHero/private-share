services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # No published ports: the shared caddy-docker-proxy serves https://<folder>.localhost.
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # Container env wins over .env, so the local URLs follow the project folder name.
            APP_URL: 'https://${COMPOSE_PROJECT_NAME}.localhost'
            SESSION_DOMAIN: '${COMPOSE_PROJECT_NAME}.localhost'
            VITE_DEV_SERVER_URL: 'https://vite.${COMPOSE_PROJECT_NAME}.localhost'
            MAIL_HOST: 'mailpit.internal'
            # Server, queue, scheduler, Vite and log tailing in one process (see DevServiceProvider).
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan dev'
        volumes:
            - '.:/var/www/html'
        labels:
            caddy: '${COMPOSE_PROJECT_NAME}.localhost'
            caddy.reverse_proxy: '{{upstreams 80}}'
            caddy_1: 'vite.${COMPOSE_PROJECT_NAME}.localhost'
            caddy_1.reverse_proxy: '{{upstreams 5173}}'
        networks:
            - sail
            - caddy
        depends_on:
            - mysql
            - mailpit
    mysql:
        image: 'mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387'
        labels:
            caddy: 'mailpit.${COMPOSE_PROJECT_NAME}.localhost'
            caddy.reverse_proxy: '{{upstreams 8025}}'
        networks:
            # The bare service name leaks onto the shared caddy network and resolves to every
            # project's Mailpit; the app uses this project-only alias instead.
            sail:
                aliases:
                    - mailpit.internal
            caddy:
networks:
    sail:
        driver: bridge
    caddy:
        external: true
volumes:
    sail-mysql:
        driver: local
